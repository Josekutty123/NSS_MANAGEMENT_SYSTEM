services:
  - type: web
    name: nss-management-system
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn nss_management.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_NAME
        value: "nss_db"
      - key: DB_USER
        value: "root"
      - key: DB_PASSWORD
        value: ""
      - key: DB_HOST
        value: "localhost"
      - key: DB_PORT
        value: "3306"
