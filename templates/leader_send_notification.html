{% extends 'base.html' %}

{% block title %}Send Notification{% endblock %}

{% block content %}
<div class="mb-4 animate__animated animate__fadeIn">
    <h2 class="fw-bold">Send Notification</h2>
    <p class="text-muted">Broadcast a message to all volunteers</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="table-card p-4 animate__animated animate__fadeInUp">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase">Notification Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g., Important Meeting" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase">Message Content</label>
                    <textarea name="message" class="form-control" rows="5" placeholder="Enter your message here..." required></textarea>
                </div>
                
                <div class="alert alert-info small border-0 shadow-sm mb-4">
                    <i class="fas fa-info-circle me-2"></i> This notification will be sent to <strong>all registered volunteers</strong>.
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                        <i class="fas fa-paper-plane me-2"></i> Send Notification
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
