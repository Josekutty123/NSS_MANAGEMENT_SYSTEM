{% extends 'base.html' %}

{% block title %}Register Blood Donor{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-8">
        <div class="form-card animate__animated animate__fadeInUp">
            <div class="text-center mb-5 border-bottom pb-4">
                <i class="fas fa-hand-holding-heart fa-3x text-danger mb-3"></i>
                <h2 class="fw-bold">Blood Donor Registration</h2>
                <p class="text-muted mb-0">Join the noble cause of blood donation</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">Registration Number</label>
                        <input type="text" class="form-control" name="regno" placeholder="AJC21..." required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">Full Name</label>
                        <input type="text" class="form-control" name="name" placeholder="Enter name" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">Age</label>
                        <input type="number" class="form-control" name="age" placeholder="Min 18" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-uppercase">Blood Group</label>
                        <select class="form-select" name="blood_group" required>
                            <option value="" selected disabled>Select Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold small text-uppercase">Phone Number</label>
                        <input type="text" class="form-control" name="phone" placeholder="10-digit mobile number" required>
                    </div>
                </div>

                <div class="row g-3 mt-5">
                    <div class="col-md-8">
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">
                            Register as Donor
                        </button>
                    </div>
                    <div class="col-md-4">
                        <a href="{% url 'bloodbank_list' %}" class="btn btn-outline-secondary btn-lg w-100">
                            Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
