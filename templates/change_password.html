{% extends 'base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="mb-4 animate__animated animate__fadeIn">
    <h2 class="fw-bold">Change Password</h2>
    <p class="text-muted">Ensure your account remains secure</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="table-card p-4 animate__animated animate__fadeInUp">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Current Password</label>
                    <input type="password" name="old_password" class="form-control" placeholder="Enter current password" required>
                </div>
                <hr>
                <div class="mb-3">
                    <label class="form-label fw-bold">New Password</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
                </div>
                <div>
                    <button type="submit" class="btn btn-primary px-4">Update Password</button>
                    <a href="{% url 'volunteer_profile' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
