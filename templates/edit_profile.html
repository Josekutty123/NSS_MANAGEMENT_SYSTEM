{% extends 'base.html' %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="mb-4 animate__animated animate__fadeIn">
    <h2 class="fw-bold">Edit Profile</h2>
    <p class="text-muted">Update your personal information</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="table-card p-4 animate__animated animate__fadeInUp">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" value="{{ user.phone }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Department</label>
                        <input type="text" name="department" class="form-control" value="{{ user.department }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Year of Study</label>
                        <select name="year" class="form-select" required>
                            <option value="1" {% if user.year == 1 %}selected{% endif %}>1st Year</option>
                            <option value="2" {% if user.year == 2 %}selected{% endif %}>2nd Year</option>
                            <option value="3" {% if user.year == 3 %}selected{% endif %}>3rd Year</option>
                            <option value="4" {% if user.year == 4 %}selected{% endif %}>4th Year</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Residential Address</label>
                        <textarea name="address" class="form-control" rows="3" required>{{ user.address }}</textarea>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                    <a href="{% url 'volunteer_profile' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
