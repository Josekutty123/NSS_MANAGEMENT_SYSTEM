{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="form-card animate__animated animate__fadeInUp">
            <div class="text-center mb-5">
                <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                <h2 class="fw-bold">Volunteer Registration</h2>
                <p class="text-muted">Join the Amal Jyothi NSS Community</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold small text-uppercase">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small text-uppercase">Registration Number</label>
                        <input type="text" name="regno" class="form-control" placeholder="AJC21CS..." required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small text-uppercase">Department</label>
                        <select name="department" class="form-select" required>
                            <option value="" selected disabled>Select Dept</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="ME">ME</option>
                            <option value="CE">CE</option>
                            <option value="CH">CH</option>
                            <option value="IT">IT</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small text-uppercase">Year</label>
                        <select name="year" class="form-select" required>
                            <option value="" selected disabled>Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small text-uppercase">Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="10-digit number" required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold small text-uppercase">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold small text-uppercase">Residential Address</label>
                        <textarea name="address" class="form-control" rows="3" placeholder="Enter your full residential address" required></textarea>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold small text-uppercase">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold small text-uppercase">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm mb-3">
                    Complete Registration
                </button>
                
                <div class="text-center">
                    <p class="text-muted mb-0">Already have an account? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Login here</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
